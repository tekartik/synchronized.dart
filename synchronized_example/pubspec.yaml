name: synchronized_example
description: Example consumer of package:synchronized that installs its agent skills.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  synchronized: '>=3.4.1'
  path: '>=1.8.0'
  process_run: '>=1.0.0'

dev_dependencies:
  lints: '>=2.1.1'
  test: '>=1.16.0'
  dev_build: '>=0.16.2'

dependency_overrides:
  synchronized:
    path: ../synchronized
